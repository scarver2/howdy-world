# _infrastructure/proxy/nginx/conf.d/javascript-vue.conf

location = /javascript-vue {
  return 301 /javascript-vue/;
}

location ^~ /javascript-vue/ {
  proxy_http_version 1.1;

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  set $upstream_javascript_vue javascript-vue;
  rewrite ^/javascript-vue/(.*)$ /$1 break;
  proxy_pass http://$upstream_javascript_vue:8080;
}
