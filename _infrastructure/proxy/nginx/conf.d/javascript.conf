# _infrastructure/proxy/nginx/conf.d/javascript.conf

location = /javascript {
  return 301 /javascript/;
}

location ^~ /javascript/ {
  proxy_http_version 1.1;

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  set $upstream_javascript javascript;
  rewrite ^/javascript/(.*)$ /$1 break;
  proxy_pass http://$upstream_javascript:8080;
}
