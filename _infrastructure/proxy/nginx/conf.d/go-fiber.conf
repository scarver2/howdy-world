# _infrastructure/proxy/nginx/conf.d/go-fiber.conf

location = /go-fiber {
  return 301 /go-fiber/;
}

location ^~ /go-fiber/ {
  proxy_http_version 1.1;

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  set $upstream_go_fiber go-fiber;
  rewrite ^/go-fiber/(.*)$ /$1 break;
  proxy_pass http://$upstream_go_fiber:3000;
}
