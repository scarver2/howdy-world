# _infrastructure/proxy/nginx/conf.d/javascript-stimulus.conf

location = /javascript-stimulus {
  return 301 /javascript-stimulus/;
}

location ^~ /javascript-stimulus/ {
  proxy_http_version 1.1;

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  set $upstream_javascript_stimulus javascript-stimulus;
  rewrite ^/javascript-stimulus/(.*)$ /$1 break;
  proxy_pass http://$upstream_javascript_stimulus:8080;
}
