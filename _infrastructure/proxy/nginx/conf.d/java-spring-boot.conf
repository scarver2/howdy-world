# _infrastructure/proxy/nginx/conf.d/java-spring-boot.conf

location = /java-spring-boot {
  return 301 /java-spring-boot/;
}

location ^~ /java-spring-boot/ {
  proxy_http_version 1.1;

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  set $upstream_java_spring_boot java-spring-boot;
  rewrite ^/java-spring-boot/(.*)$ /$1 break;
  proxy_pass http://$upstream_java_spring_boot:8080;
}
