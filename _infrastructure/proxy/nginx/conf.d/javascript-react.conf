# _infrastructure/proxy/nginx/conf.d/javascript-react.conf

location = /javascript-react {
  return 301 /javascript-react/;
}

location ^~ /javascript-react/ {
  proxy_http_version 1.1;

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # NOTE: no trailing slash — React dev server routes on the full /javascript-react/ prefix
  set $upstream_javascript_react javascript-react;
  proxy_pass http://$upstream_javascript_react:8080;
}
