# _infrastructure/proxy/nginx/conf.d/ruby-rage.conf

location = /ruby-rage {
  return 301 /ruby-rage/;
}

location ^~ /ruby-rage/ {
  proxy_http_version 1.1;

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  set $upstream_ruby_rage ruby-rage;
  rewrite ^/ruby-rage/(.*)$ /$1 break;
  proxy_pass http://$upstream_ruby_rage:3000;
}
