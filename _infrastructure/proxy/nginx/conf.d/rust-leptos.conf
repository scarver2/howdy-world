# _infrastructure/proxy/nginx/conf.d/rust-leptos.conf

location = /rust-leptos {
  return 301 /rust-leptos/;
}

location ^~ /rust-leptos/ {
  proxy_http_version 1.1;

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  set $upstream_rust_leptos rust-leptos;
  rewrite ^/rust-leptos/(.*)$ /$1 break;
  proxy_pass http://$upstream_rust_leptos:3000;
}
